apply plugin: 'com.android.application'

// Version is the git commit count, so every build reports which commit it
// came from (shown by the bridge on phone hello). Computed once at the top
// level (project scope) — nested DSL closures resolve `exec` unreliably.
// Falls back to 1 when git is unavailable (e.g. source export).
def commitCount = 1
try {
    def out = new ByteArrayOutputStream()
    project.exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        // project.rootDir is the repo root (settings.gradle maps :app here).
        workingDir(project.rootDir)
        standardOutput = out
    }
    commitCount = out.toString().trim().toInteger()
} catch (Exception ignored) {}

android {
    compileSdk = 35
    lintOptions {
        abortOnError = false
    }
    // Explicit: DebugLog/VrActivity/TelemetrySender read BuildConfig.DEBUG /
    // VERSION_NAME (commit count), so generation must never silently vanish
    // under a future AGP default flip.
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.cardboardplusplus"
        // #gles3 #vulkan - You can reduce minSdkVersion down to 16 depending
        // on rendering APIs supported:
        //
        // OpenGL ES 2.0 - Requires 16 or higher
        // OpenGL ES 3.0 - Requires 18 or higher
        // Vulkan        - Requires 24 or higher
        //
        // See the release notes for details.
        minSdkVersion = 26
        targetSdkVersion = 35
        versionCode commitCount
        versionName "$commitCount"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild.cmake {
            arguments "-DANDROID_STL=c++_shared"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild.cmake {
        path "CMakeLists.txt"
    }
    namespace = 'com.google.cardboard'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // NOTE: no ffmpeg-kit (the native H264Decoder it served is deleted; the
    // live path is receiver -> Java MediaCodec), no play-services-vision /
    // protobuf / material (zero imports; vision TODO migrated away).
    // Keep this list minimal: every dep costs APK size on a sideloaded app.
    implementation project(":sdk")
    testImplementation 'junit:junit:4.13.2'
}

// The dependencies for NDK builds live inside the .aar files so they need to
// be extracted before NDK targets can link against.
task extractNdk {
    dependsOn ":sdk:assembleRelease"
    inputs.file("${project.rootDir}/sdk/build/outputs/aar/sdk-release.aar")
    inputs.file("${project.rootDir}/sdk/include/cardboard.h")
    outputs.dir("libraries/jni")
    doLast {
        copy {
            from zipTree("${project.rootDir}/sdk/build/outputs/aar/sdk-release.aar")
            into "libraries/"
            include "jni/**/libGfxPluginCardboard.so"
        }
        copy {
            from "${project.rootDir}/sdk/include/cardboard.h"
            into "libraries/"
        }
    }
}

task deleteNdk(type: Delete) {
    delete "libraries/jni"
    delete "libraries/cardboard.h"
}

tasks.configureEach { task ->
    if (task.name.startsWith("buildCMake")) {
        task.dependsOn extractNdk
    }
}

clean.dependsOn(deleteNdk)
