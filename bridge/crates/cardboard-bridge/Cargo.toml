[package]
name = "cardboard-bridge"
version = "0.1.0"
edition = "2021"
description = "Cardboard++ control plane: talks to the SteamVR driver and the phone, without touching the video stream"

[dependencies]
bridge-core = { path = "../bridge-core" }
bridge-shm = { path = "../bridge-shm" }
slint = { workspace = true }
tiny_http = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.5"
zune-core = "0.5"
anyhow = "1"

[build-dependencies]
slint-build = { workspace = true }
