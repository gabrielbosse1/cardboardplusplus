[package]
name = "bridge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Slint desktop UI for the bridge (settings, VR preview, status)."

[dependencies]
bridge-core = { path = "../bridge-core" }
bridge-shm = { path = "../bridge-shm" }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }