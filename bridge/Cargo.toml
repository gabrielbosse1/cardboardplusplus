[package]
name = "cardboardplusplus-bridge"
version = "1.0.0"
edition = "2021"
description = "Bridge UI for Cardboard++ SteamVR driver"

[dependencies]
slint = "1.17"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[build-dependencies]
slint-build = "1.17"
