[workspace]
resolver = "2"
members = [
    "crates/bridge-shm",
    "crates/bridge-core",
    "crates/bridge-ui",
    "crates/cardboard-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gabrielbosse1/cardboardplusplus"

[profile.release]
opt-level = 3
lto = "thin"
