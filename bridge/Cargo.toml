[workspace]
resolver = "2"
members = [
    "crates/bridge-shm",
    "crates/bridge-core",
    "crates/bridge-ui",
    "crates/cardboard-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gabrielbosse1/cardboardplusplus"

# Single Slint version for every crate (split versions broke the workspace build).
[workspace.dependencies]
slint = "1.17"
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = "thin"

# zune-jpeg relies on SIMD intrinsics that are very slow in debug builds.
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
