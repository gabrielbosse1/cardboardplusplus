name: Release

# One GitHub Release per master commit: builds the bridge (release), the
# driver (Release DLL) and the APK, then attaches all three to a release
# tagged r<commit-count>. The commit count is also the version the driver
# and the app report to the bridge at runtime.
on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.ver.outputs.count }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # rev-list --count needs the full history
    - id: ver
      run: |
        echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  bridge:
    needs: version
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build bridge (release)
      run: cargo build --release --manifest-path bridge/Cargo.toml
    - name: Upload bridge exe
      uses: actions/upload-artifact@v4
      with:
        name: bridge-r${{ needs.version.outputs.count }}
        path: bridge/target/release/cardboard-bridge-svc.exe

  bridge-files:
    # Payload the web installer downloads (stable asset name bridge-files.zip):
    # exe + sidecar + model + embedded Python with deps preinstalled.
    needs: version
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Stage bridge payload
      run: ./scripts/stage-bridge-files.ps1 -Release
      shell: pwsh
    - name: Upload bridge payload
      uses: actions/upload-artifact@v4
      with:
        name: bridge-files
        path: installer/dist/bridge-files.zip

  installer:
    # Web Setup.exe: tiny, downloads bridge-files.zip from the release.
    # No Rust needed: the payload is never inside Setup.exe.
    needs: version
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Inno Setup 6
      run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
      shell: pwsh
    - name: Build Setup.exe
      run: ./scripts/compile-installer.ps1 -SkipBridge
      shell: pwsh
    - name: Upload Setup.exe
      uses: actions/upload-artifact@v4
      with:
        name: setup
        path: installer/dist/CardboardBridge-Setup-*.exe

  driver:
    needs: version
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Bake commit count into DriverVersion.h
      # The version job's count (also the release tag) wins over a fresh
      # rev-list, so the baked driver can never drift from the tag when
      # master advances mid-release.
      run: ./scripts/bake-driver-version.ps1 -Count "${{ needs.version.outputs.count }}"
      shell: pwsh
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build driver (Release)
      run: msbuild driver_cardboardplusplus\driver_cardboardplusplus.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
    - name: Upload driver DLL
      uses: actions/upload-artifact@v4
      with:
        name: driver-r${{ needs.version.outputs.count }}
        path: driver_cardboardplusplus\x64\Release\driver_cardboardplusplus.dll

  apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build APK
      run: ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-r${{ needs.version.outputs.count }}
        path: cardboardplusplus-android/build/outputs/apk/debug/app-debug.apk

  publish:
    needs: [version, bridge, bridge-files, installer, driver, apk]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        COUNT="${{ needs.version.outputs.count }}"
        SHA="${{ needs.version.outputs.sha }}"
        TAG="r$COUNT"
        mv "dist/bridge-r$COUNT/cardboard-bridge-svc.exe" "dist/cardboard-bridge-svc-r$COUNT.exe"
        mv "dist/driver-r$COUNT/driver_cardboardplusplus.dll" "dist/driver_cardboardplusplus-r$COUNT.dll"
        mv "dist/app-r$COUNT/app-debug.apk" "dist/cardboardplusplus-r$COUNT.apk"
        # Stable names: the web installer fetches these from latest/download.
        mv dist/bridge-files/bridge-files.zip dist/bridge-files.zip
        mv dist/setup/CardboardBridge-Setup-*.exe dist/CardboardBridge-Setup.exe
        NOTES="$(git log -1 --format='%h %s')"
        if gh release view "$TAG" >/dev/null 2>&1; then
          # Re-run on the same commit: just refresh the files.
          gh release upload "$TAG" dist/cardboard-bridge-svc-r$COUNT.exe dist/driver_cardboardplusplus-r$COUNT.dll dist/cardboardplusplus-r$COUNT.apk dist/bridge-files.zip dist/CardboardBridge-Setup.exe --clobber
        else
          gh release create "$TAG" dist/cardboard-bridge-svc-r$COUNT.exe dist/driver_cardboardplusplus-r$COUNT.dll dist/cardboardplusplus-r$COUNT.apk dist/bridge-files.zip dist/CardboardBridge-Setup.exe \
            --title "r$COUNT ($SHA)" --notes "$NOTES"
        fi
