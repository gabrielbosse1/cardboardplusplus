name: Bridge Tests

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run bridge tests
      shell: pwsh
      run: |
        # Tee the output so failures reach the annotation budget (job logs
        # themselves are not retrievable from this setup).
        cargo test --manifest-path bridge/Cargo.toml 2>&1 | Tee-Object -FilePath cargo-test.log
        exit $LASTEXITCODE
    - name: Bridge failure annotations
      if: failure()
      shell: pwsh
      run: |
        Get-Content cargo-test.log -ErrorAction SilentlyContinue |
          Select-String -Pattern 'panicked at|assertion|error\[E|error:|test result: FAILED|failures:' |
          Select-Object -First 8 |
          ForEach-Object { $m = $_.ToString().Trim(); if ($m.Length -gt 220) { $m = $m.Substring(0, 220) }; "::error::$m" }

  installer:
    # Web Setup.exe compiles offline (payload downloads at install time),
    # so this validates bridge.iss on every PR without Rust or downloads.
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Inno Setup 6
      run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
      shell: pwsh

    - name: Build Setup.exe
      run: ./scripts/compile-installer.ps1 -SkipBridge
      shell: pwsh
