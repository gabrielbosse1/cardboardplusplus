name: Linux Driver

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # Build the SteamVR driver as a Linux shared object, run the driver wire
  # protocol tests under g++, and validate the install path. The driver's
  # OpenVR driver-API calls are all inline accessors (see openvr_driver.h), so
  # it links against a stub openvr_api.so with no real symbols — the same .so
  # SteamVR loads at runtime provides the context at load time, not link time.
  driver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # DriverVersion.h is baked from rev-list --count

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake pkg-config \
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
          libvulkan-dev libx11-dev

    - name: Check Linux installer scripts
      run: |
        for f in scripts/lib/linux-common.sh scripts/*.sh; do bash -n "$f"; done
        bash scripts/install-linux.sh --help

    - name: Download DirectXShaderCompiler (dxc) for Linux
      run: |
        DXC_VERSION="v1.9.2609"
        DXC_TAR="linux_dxc_2026_09_28.x86_x64.tar.gz"
        curl -fsSL -o /tmp/dxc.tar.gz \
          "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_VERSION}/${DXC_TAR}"
        sudo mkdir -p /opt/dxc
        sudo tar -xzf /tmp/dxc.tar.gz -C /opt/dxc
        # The archive extracts to a subdir; find the dxc binary and expose it.
        DXC_BIN=$(find /opt/dxc -name dxc -type f | head -1)
        echo "dxc binary: $DXC_BIN"
        sudo ln -sf "$DXC_BIN" /usr/local/bin/dxc
        dxc --version || true

    - name: Create stub openvr_api.so for linking
      # The driver references zero non-inline OpenVR symbols (all driver-API
      # calls are inline accessors on the module context). SteamVR supplies the
      # real openvr_api.so at load time; for a CI link a stub is sufficient and
      # proves the driver does not depend on any OpenVR symbol at link time.
      run: |
        # No sudo: a root-owned stub dir would reject the non-root cat below.
        mkdir -p /tmp/openvr_stub
        cat > /tmp/openvr_stub/stub.c <<'EOF'
        /* CI stub: the driver's OpenVR driver-API calls are inline accessors
         * (openvr_driver.h), so no real OpenVR symbols are needed at link time.
         * SteamVR provides the context when it loads the driver .so at runtime. */
        int __cbpp_openvr_stub(void) { return 0; }
        EOF
        gcc -shared -fPIC -o /tmp/openvr_stub/libopenvr_api.so /tmp/openvr_stub/stub.c
        cp /tmp/openvr_stub/libopenvr_api.so /tmp/openvr_stub/openvr_api.so
        # Both names: find_library(NAMES openvr_api) matches the lib-prefixed
        # convention, while the SteamVR-style name documents the runtime shape.
        ls -la /tmp/openvr_stub

    - name: Bake commit count into DriverVersion.h
      run: bash scripts/bake-driver-version.sh

    - name: Configure and build the driver
      run: |
        # Output goes to a log so failures can be surfaced as annotations
        # (job logs themselves are not retrievable from this setup).
        if ! cmake -S driver_cardboardplusplus -B driver_cardboardplusplus/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCBPP_OPENVR_DIR=/tmp/openvr_stub > /tmp/cbpp_build.log 2>&1; then
          tail -30 /tmp/cbpp_build.log
          grep -iE "CMake Error|error|unknown|warning" /tmp/cbpp_build.log | head -8 | while IFS= read -r line; do echo "::error::configure: ${line:0:230}"; done
          exit 1
        fi
        if ! cmake --build driver_cardboardplusplus/build --parallel "$(nproc)" >> /tmp/cbpp_build.log 2>&1; then
          tail -40 /tmp/cbpp_build.log
          grep -iE "error|unknown|failed|dxc" /tmp/cbpp_build.log | head -8 | while IFS= read -r line; do echo "::error::build: ${line:0:230}"; done
          exit 1
        fi
        tail -3 /tmp/cbpp_build.log

    - name: SPIR-V facts and lavapipe smoke test (regression suite)
      run: |
        set +e
        sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers > /dev/null 2>&1
        python3 - <<'EOF' > /tmp/facts.txt 2> /tmp/facts.err
        import struct
        # SPIR-V decoration ids per the vendored spirv.hpp: Binding=33,
        # DescriptorSet=34, Location=30 (an earlier revision swapped bind/set,
        # which misread every dump and briefly pointed the investigation at a
        # descriptor mismatch that does not exist).
        DEC = {2: "block", 11: "builtin", 25: "nonwritable", 30: "loc", 33: "bind", 34: "set"}
        STOR = {0: "in", 1: "out"}
        for name in ["compose_vs", "compose_ps", "nv12_cs"]:
            data = open(f"driver_cardboardplusplus/build/spirv/{name}.spv", "rb").read()
            n = len(data) // 4
            words = struct.unpack(f"<{n}I", data)
            nm = {}
            rows = []
            i = 5
            while i + 1 < n:
                wc = words[i] >> 16; op = words[i] & 0xFFFF
                if wc == 0 or i + wc > n:
                    break
                if op == 5 and wc >= 2:
                    chars = []
                    for j in range(i + 2, i + wc):
                        for s in range(4):
                            c = (words[j] >> (8 * s)) & 0xFF
                            if c == 0:
                                break
                            chars.append(chr(c))
                    nm[words[i + 1]] = "".join(chars)
                elif op == 71 and wc >= 3:
                    tid, dec = words[i + 1], words[i + 2]
                    lit = words[i + 3] if wc >= 4 else 0
                    if dec in (11, 32, 33, 34):
                        rows.append(f"{nm.get(tid, tid)}:{DEC[dec]}={lit}")
                elif op == 59 and wc >= 4:
                    tid, sc = words[i + 2], words[i + 3]
                    if sc in STOR:
                        rows.append(f"{nm.get(tid, tid)}:st={STOR[sc]}")
                i += wc
            print(f"F {name} ver=0x{words[1]:04x} words={n} " + " ".join(rows))
        EOF
        while IFS= read -r line; do echo "FACT ${line:0:230}"; done < /tmp/facts.txt
        PYE=$(tail -2 /tmp/facts.err | head -c 200)
        if [ -n "$PYE" ]; then echo "::error::PYERR $PYE"; fi
        # Phase B/C link the REAL production components (VulkanContext,
        # VulkanCompose, VideoEncoder + FFmpeg) on top of the SPIR-V replica,
        # so the shipped code paths run under test on lavapipe. DriverLog.cpp
        # is NOT linked: outside SteamVR the driver context is null and its
        # first call would crash — the test provides a stderr sink instead.
        g++ -std=c++17 -O1 -DCBPP_ENCODER_E2E_TEST \
          -I driver_cardboardplusplus/include -I driver_cardboardplusplus/build/spirv \
          -o /tmp/vk_smoke driver_cardboardplusplus/tests/vulkan_pipeline_smoke.cpp \
          driver_cardboardplusplus/src/VulkanContext.cpp \
          driver_cardboardplusplus/src/VulkanCompose.cpp \
          driver_cardboardplusplus/src/VideoEncoder.cpp \
          driver_cardboardplusplus/src/VideoEncoderFFmpeg.cpp \
          driver_cardboardplusplus/src/VideoEncoderShaders.cpp \
          -lvulkan -lavcodec -lavutil -lswscale -lavformat \
          > /tmp/smoke_build.log 2>&1
        BUILDRC=$?
        echo "SMOKE compile rc=$BUILDRC"
        if [ $BUILDRC -ne 0 ]; then
          grep -m4 -E "error" /tmp/smoke_build.log | while IFS= read -r line; do echo "::error::smoke-build: ${line:0:220}"; done
          exit 1
        fi
        ICD=$(find /usr/share/vulkan /etc/vulkan -name 'lvp_icd*.json' -o -name 'swiftshader*.json' 2>/dev/null | head -1)
        echo "SMOKE icd=$ICD"
        VK_ICD_FILENAMES="$ICD" VK_DRIVER_FILES="$ICD" \
        /tmp/vk_smoke > /tmp/smoke.log 2>&1
        SMOKERC=$?
        echo "SMOKE run rc=$SMOKERC checks=$(grep -c '^== ' /tmp/smoke.log)"
        # GitHub keeps only the first 10 error annotations per check run, so on
        # failure emit exactly what pinpoints the problem: FAIL lines and the
        # raw log tail (a segfault leaves no FAIL/RESULT line behind).
        if [ $SMOKERC -ne 0 ]; then
          grep '^== FAIL' /tmp/smoke.log | head -4 | while IFS= read -r line; do echo "::error::smoke: ${line:0:200}"; done
          tail -6 /tmp/smoke.log | while IFS= read -r line; do echo "::error::tail: ${line:0:200}"; done
          exit $SMOKERC
        fi
        # Encoder internals e2e (same real sources as phase C): keyframe policy,
        # GOP cadence + heartbeat pts, GPU/CPU source switching, telemetry
        # arithmetic, shutdown drain, hardware fallback order.
        g++ -std=c++17 -O1 -DCBPP_ENCODER_E2E_TEST -Wall -Wextra \
          -I driver_cardboardplusplus/include -I driver_cardboardplusplus/build/spirv \
          -o /tmp/enc_e2e driver_cardboardplusplus/tests/encoder_unit_test.cpp \
          driver_cardboardplusplus/src/VulkanContext.cpp \
          driver_cardboardplusplus/src/VulkanCompose.cpp \
          driver_cardboardplusplus/src/VideoEncoder.cpp \
          driver_cardboardplusplus/src/VideoEncoderFFmpeg.cpp \
          driver_cardboardplusplus/src/VideoEncoderShaders.cpp \
          -lvulkan -lavcodec -lavutil -lswscale -lavformat \
          > /tmp/enc_e2e_build.log 2>&1
        E2EBUILDRC=$?
        echo "ENC-E2E compile rc=$E2EBUILDRC"
        if [ $E2EBUILDRC -ne 0 ]; then
          grep -m4 -E "error" /tmp/enc_e2e_build.log | while IFS= read -r line; do echo "::error::enc-e2e-build: ${line:0:220}"; done
          exit 1
        fi
        VK_ICD_FILENAMES="$ICD" VK_DRIVER_FILES="$ICD" \
        /tmp/enc_e2e > /tmp/enc_e2e.log 2>&1
        E2ERC=$?
        echo "ENC-E2E run rc=$E2ERC checks=$(grep -c '^== ' /tmp/enc_e2e.log)"
        if [ $E2ERC -ne 0 ]; then
          grep '^== FAIL' /tmp/enc_e2e.log | head -4 | while IFS= read -r line; do echo "::error::enc-e2e: ${line:0:200}"; done
          tail -6 /tmp/enc_e2e.log | while IFS= read -r line; do echo "::error::tail: ${line:0:200}"; done
          exit $E2ERC
        fi
        # Vulkan compose matrix: resolution/layer/degenerate/subrect policy on
        # the real VulkanCompose, determinism, fd-leak soak, and (when the
        # runner has it) the KHRONOS validation layer as the multi-hardware
        # API-misuse proxy.
        sudo apt-get install -y --no-install-recommends vulkan-validationlayers > /dev/null 2>&1 || true
        g++ -std=c++17 -O1 -Wall -Wextra \
          -I driver_cardboardplusplus/include -I driver_cardboardplusplus/build/spirv \
          -o /tmp/vk_matrix driver_cardboardplusplus/tests/vulkan_compose_matrix_test.cpp \
          driver_cardboardplusplus/src/VulkanContext.cpp \
          driver_cardboardplusplus/src/VulkanCompose.cpp \
          -lvulkan -lswscale -lavutil \
          > /tmp/vk_matrix_build.log 2>&1
        MATBUILDRC=$?
        echo "VK-MATRIX compile rc=$MATBUILDRC"
        if [ $MATBUILDRC -ne 0 ]; then
          grep -m4 -E "error" /tmp/vk_matrix_build.log | while IFS= read -r line; do echo "::error::vk-matrix-build: ${line:0:220}"; done
          exit 1
        fi
        VK_ICD_FILENAMES="$ICD" VK_DRIVER_FILES="$ICD" \
        /tmp/vk_matrix > /tmp/vk_matrix.log 2>&1
        MATRC=$?
        echo "VK-MATRIX run rc=$MATRC checks=$(grep -c '^== ' /tmp/vk_matrix.log)"
        if [ $MATRC -ne 0 ]; then
          grep '^== FAIL' /tmp/vk_matrix.log | head -4 | while IFS= read -r line; do echo "::error::vk-matrix: ${line:0:200}"; done
          grep -m3 'VVL-ERROR' /tmp/vk_matrix.log | while IFS= read -r line; do echo "::error::vvl: ${line:0:200}"; done
          tail -6 /tmp/vk_matrix.log | while IFS= read -r line; do echo "::error::tail: ${line:0:200}"; done
        fi
        exit $MATRC

    - name: Verify the shared object
      run: |
        SO=driver_cardboardplusplus/build/libdriver_cardboardplusplus.so
        [ -f "$SO" ] || { echo "missing $SO"; exit 1; }
        # The driver factory must be exported (SteamVR calls it via dlopen).
        if ! nm -D "$SO" | grep -q "T HmdDriverFactory"; then
          echo "HmdDriverFactory not exported from $SO"; nm -D "$SO" | head; exit 1
        fi
        echo "HmdDriverFactory exported from $SO"
        # Confirm no undefined OpenVR symbols (inline accessors only).
        if nm -D --undefined-only "$SO" | grep -qE "\b(VR[A-Z]|OpenVR|InitServerDriverContext)"; then
          echo "unexpected undefined OpenVR symbols:"; nm -D --undefined-only "$SO" | grep -E "\b(VR[A-Z]|OpenVR|InitServerDriverContext)"; exit 1
        fi
        echo "no undefined OpenVR symbols (inline accessors confirmed)"
        # A missing source file leaves C++ symbols unresolved at link time on ELF;
        # SteamVR only finds them when it dlopen()s the driver.
        if nm -D --undefined-only "$SO" | grep -qE '\b(HmdDriver|VulkanCompose|VideoEncoder|DeviceProvider|BridgeServer|HandDriver|DirectMode)'; then
          echo "unresolved driver symbols:"; nm -D --undefined-only "$SO" | grep -E '\b(HmdDriver|VulkanCompose|VideoEncoder|DeviceProvider|BridgeServer|HandDriver|DirectMode)'; exit 1
        fi
        echo "no unresolved driver symbols"

    - name: Driver wire-protocol tests (g++)
      run: |
        g++ -std=c++17 -O2 -I driver_cardboardplusplus/include \
          -o driver_cardboardplusplus/build/driver_tests \
          driver_cardboardplusplus/tests/test_wire_protocol.cpp
        ./driver_cardboardplusplus/build/driver_tests
        g++ -std=c++17 -O2 -I driver_cardboardplusplus/include \
          -o driver_cardboardplusplus/build/eye_format_tests \
          driver_cardboardplusplus/tests/test_eye_format.cpp
        ./driver_cardboardplusplus/build/eye_format_tests
        # UDP transport: real loopback sockets exercising the send chunker,
        # pacing, buffer-overflow shapes and the IDR resync policy.
        g++ -std=c++17 -O2 -I driver_cardboardplusplus/include \
          -o driver_cardboardplusplus/build/udp_tests \
          driver_cardboardplusplus/tests/udp_transport_test.cpp
        ./driver_cardboardplusplus/build/udp_tests
        # Encoder unit tests: H.264 helper matrix (IDR insertion points, BE
        # framing) — pure phase; the CBPP_ENCODER_E2E_TEST phase links the real
        # encoder sources in the smoke step below.
        g++ -std=c++17 -O2 -Wall -Wextra -I driver_cardboardplusplus/include \
          -o driver_cardboardplusplus/build/encoder_unit_tests \
          driver_cardboardplusplus/tests/encoder_unit_test.cpp
        ./driver_cardboardplusplus/build/encoder_unit_tests

    - name: Validate driver manifest and profile
      run: |
        python3 - <<'PY'
        import json
        base = "driver_cardboardplusplus/resources"
        # driver.vrdrivermanifest: documented schema fields (OpenVR DriverManifest).
        with open(f"{base}/driver.vrdrivermanifest") as f:
            m = json.load(f)
        assert m["name"] == "cardboardplusplus", m
        assert m["alwaysActivate"] is True, m
        assert "directory" in m, "manifest missing directory field"
        assert "resourceOnly" in m, "manifest missing resourceOnly field"
        # The driver .so name must follow driver_<name>.so (SteamVR load convention).
        assert m["name"] == "cardboardplusplus"
        with open(f"{base}/controller_profile.json") as f:
            p = json.load(f)
        assert "controller_type" in p, p
        print("manifest and profile valid")
        PY

    - name: Test install script (dry run into a temp SteamVR tree)
      run: |
        # The installer reads the .so from the repo build dir (driver_cardboardplusplus/build)
        # and writes the full driver + bridge app to $HOME/.local/...
        # Point HOME at a temp dir so the install lands there without touching the runner.
        TMPHOME="$(mktemp -d)"
        HOME="$TMPHOME" bash scripts/install-driver-linux.sh
        # Verify the complete driver layout: .so, manifest, and resources.
        ROOT="$TMPHOME/.local/share/SteamVR/drivers/cardboardplusplus"
        SO="$ROOT/bin/linux64/driver_cardboardplusplus.so"
        MANIFEST="$ROOT/driver.vrdrivermanifest"
        RES="$ROOT/resources"
        for f in "$SO" "$MANIFEST"; do
          [ -f "$f" ] || { echo "missing $f"; find "$TMPHOME" -type f; exit 1; }
        done
        echo "install script placed the .so and manifest correctly"
        # Resources must include the controller profile.
        [ -f "$RES/controller_profile.json" ] || { echo "missing controller_profile.json"; find "$RES" -type f 2>/dev/null; exit 1; }
        echo "install script copied resources (incl. controller_profile.json)"
        # Verify the manifest is valid JSON with the expected name.
        python3 - <<EOF
        import json, sys
        m = json.load(open('$MANIFEST'))
        assert m['name'] == 'cardboardplusplus', m
        print('installed manifest valid')
        EOF
        # Verify the bridge app desktop entry + icon are installed for the launcher.
        DESKTOP="$TMPHOME/.local/share/applications/cardboardplusplus.desktop"
        [ -f "$DESKTOP" ] || { echo "missing desktop entry $DESKTOP"; exit 1; }
        grep -q "Type=Application" "$DESKTOP" || { echo "desktop entry missing Type=Application"; exit 1; }
        grep -q "Icon=cardboardplusplus" "$DESKTOP" || { echo "desktop entry missing Icon"; exit 1; }
        echo "desktop entry installed correctly"
        # Verify the app icon is installed in all expected sizes.
        for size in 16x16 32x32 48x48 64x64 128x128 256x256; do
          [ -f "$TMPHOME/.local/share/icons/hicolor/$size/apps/cardboardplusplus.png" ] \
            || { echo "missing app icon for size $size"; find "$TMPHOME/.local/share/icons" -type f; exit 1; }
        done
        echo "app icon installed in all sizes (16x16 through 256x256)"

    - name: Upload driver artifact
      uses: actions/upload-artifact@v4
      with:
        name: driver-linux
        path: driver_cardboardplusplus/build/libdriver_cardboardplusplus.so

  # The bridge control plane and its end-to-end suite (fake driver/phone/sidecar
  # over the real wire, image decode comparison, SHM telemetry) are cross-platform
  # Rust. Run the same suite on Linux to prove the control plane works there too.
  bridge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install ffmpeg and fontconfig dev (e2e image decode, font crates)
      # yeslogic-fontconfig-sys (via the UI font stack) panics in build.rs when
      # pkg-config cannot find fontconfig; the e2e suite shells out to ffmpeg.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libfontconfig1-dev

    - name: Run bridge tests and e2e suite
      run: |
        # Same annotation-diagnostics pattern as the driver build step.
        if ! cargo test --manifest-path bridge/Cargo.toml -- --test-threads=1 \
            > /tmp/bridge_test.log 2>&1; then
          tail -40 /tmp/bridge_test.log
          grep -E "^error" /tmp/bridge_test.log | head -8 | while IFS= read -r line; do echo "::error::bridge: ${line:0:220}"; done
          grep -E "^test .* FAILED|panicked at" /tmp/bridge_test.log | head -8 | while IFS= read -r line; do echo "::error::bridge: ${line:0:220}"; done
          # Fall back to raw tail lines so non-standard failures (aborts,
          # kills, harness exits) are visible through annotations too.
          tail -12 /tmp/bridge_test.log | while IFS= read -r line; do echo "::error::tail: ${line:0:220}"; done
          exit 1
        fi
        tail -5 /tmp/bridge_test.log
