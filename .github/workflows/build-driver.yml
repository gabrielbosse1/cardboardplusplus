name: Build Driver

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # DriverVersion.h is baked from rev-list --count

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bake commit count into DriverVersion.h
      run: ./scripts/bake-driver-version.ps1
      shell: pwsh

    - name: Compile SPIR-V shaders (dxc)
      # Generates include/shaders/spirv/*.spv.h with the same dxc flags as the
      # Linux build; VulkanCompose embeds these instead of runtime-translating
      # DXBC through dxil-spirv (which emitted descriptor sets the pipeline
      # layouts never matched, and crashed on the NV12 compute shader).
      shell: pwsh
      run: |
        # Syntax-check the script first: a parse error would otherwise fail the
        # step before any diagnostic output exists.
        $parseErrors = $null
        [System.Management.Automation.Language.Parser]::ParseFile(
          (Join-Path $PWD "scripts\build-spirv.ps1"), [ref]$null, [ref]$parseErrors) | Out-Null
        if ($parseErrors) {
          $parseErrors | Select-Object -First 8 |
            ForEach-Object { "::error::PARSE line $($_.Extent.StartLineNumber): $($_.Message)" }
          exit 1
        }
        try {
          & ./scripts/build-spirv.ps1
        } catch {
          "::error::build-spirv threw: $($_.Exception.Message)"
          $stack = ($_.ScriptStackTrace -split "`n")[0]
          if ($stack) { "::error::$stack" }
          exit 1
        }

    - name: SPIR-V facts (TEMP diagnostics)
      if: always()
      shell: pwsh
      run: |
        $lines = @()
        foreach ($name in @("compose_vs", "compose_ps", "nv12_cs")) {
          $p = "driver_cardboardplusplus\include\shaders\spirv\$name.spv"
          if (-not (Test-Path $p)) { $lines += "MISSING $p"; continue }
          $bytes = [IO.File]::ReadAllBytes($p)
          $n = [math]::Floor($bytes.Length / 4)
          $ver = '{0:x8}' -f [BitConverter]::ToUInt32($bytes, 4)
          $lines += "### $name : $n words, version 0x$ver"
          $names2 = @{}
          $i = 5
          while ($i + 1 -lt $n) {
            $w = [BitConverter]::ToUInt32($bytes, $i*4)
            $wc = $w -shr 16; $op = $w -band 0xFFFF
            if ($wc -eq 0) { break }
            if ($i + $wc -gt $n) { break }
            if ($op -eq 5 -and $wc -ge 2) {
              $t = [BitConverter]::ToUInt32($bytes, ($i+1)*4)
              $sb = New-Object System.Text.StringBuilder
              for ($j = $i + 2; $j -lt ($i + $wc); $j++) {
                $w4 = [BitConverter]::ToUInt32($bytes, $j*4)
                foreach ($b in 0..3) {
                  $c = ($w4 -shr (8*$b)) -band 0xFF
                  if ($c -eq 0) { $j = $i + $wc; break }
                  [void]$sb.Append([char]$c)
                }
              }
              $names2[$t] = $sb.ToString()
            } elseif ($op -eq 71 -and $wc -ge 3) {
              $t = [BitConverter]::ToUInt32($bytes, ($i+1)*4)
              $d = [BitConverter]::ToUInt32($bytes, ($i+2)*4)
              $lit = 0
              if ($wc -ge 4) { $lit = [BitConverter]::ToUInt32($bytes, ($i+3)*4) }
              if ($d -in 11, 25, 32, 33, 34) {
                $nm = if ($names2.ContainsKey($t)) { $names2[$t] } else { "$t" }
                $lines += "| $name | $nm | dec=$d | $lit |"
              }
            } elseif ($op -eq 59 -and $wc -ge 4) {
              $t = [BitConverter]::ToUInt32($bytes, ($i+2)*4)
              $sc = [BitConverter]::ToUInt32($bytes, ($i+3)*4)
              $nm = if ($names2.ContainsKey($t)) { $names2[$t] } else { "$t" }
              $lines += "| $name | $nm | storage | $sc |"
            }
            $i += $wc
          }
        }
        $lines | ForEach-Object { Write-Host $_ }
        $lines | Add-Content $env:GITHUB_STEP_SUMMARY

    - name: Build Driver
      run: msbuild driver_cardboardplusplus\driver_cardboardplusplus.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:PlatformToolset=v143


    - name: Driver unit tests
      shell: pwsh
      run: |
        # cl is not on PATH in a bare pwsh shell; enter the VS dev environment first,
        # same as scripts/compile-driver.ps1 does locally.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsRoot = & $vswhere -latest -property installationPath
        $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:driver_tests.exe /Fo:driver_tests_ driver_cardboardplusplus\tests\test_wire_protocol.cpp"
        if ($LASTEXITCODE -ne 0) { throw "driver test compile failed (cl exit $LASTEXITCODE)" }
        .\driver_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "driver tests failed" }
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:eye_format_tests.exe /Fo:eye_format_tests_ driver_cardboardplusplus\tests\test_eye_format.cpp"
        if ($LASTEXITCODE -ne 0) { throw "eye format test compile failed (cl exit $LASTEXITCODE)" }
        .\eye_format_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "eye format tests failed" }
