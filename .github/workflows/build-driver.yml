name: Build Driver

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # TEMP: commit msbuild.log for log retrieval (blocked blob storage)
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # DriverVersion.h is baked from rev-list --count

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bake commit count into DriverVersion.h
      run: ./scripts/bake-driver-version.ps1
      shell: pwsh

    - name: Build Driver
      run: |
        msbuild driver_cardboardplusplus\driver_cardboardplusplus.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:PlatformToolset=v143 *> msbuild.log
        if ($LASTEXITCODE -ne 0) {
          $errs = Select-String -Path msbuild.log -Pattern ' error ' | Select-Object -First 9
          if ($errs.Count -eq 0) {
            Get-Content msbuild.log -Tail 25 | ForEach-Object { "::error::$_" }
          } else {
            $errs | ForEach-Object { "::error::$($_.Line)" }
          }
          exit 1
        }

    - name: Commit build log (TEMP diagnostics)
      if: failure()
      continue-on-error: true
      shell: pwsh
      run: |
        git config user.name "ci-log-bot"
        git config user.email "ci-log-bot@users.noreply.github.com"
        git add -f msbuild.log
        git commit -m "TEMP: record msbuild log [skip ci]"
        git push origin HEAD:arena/ad49431b-cardboardplusplus


    - name: Driver unit tests
      shell: pwsh
      run: |
        # cl is not on PATH in a bare pwsh shell; enter the VS dev environment first,
        # same as scripts/compile-driver.ps1 does locally.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsRoot = & $vswhere -latest -property installationPath
        $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:driver_tests.exe /Fo:driver_tests_ driver_cardboardplusplus\tests\test_wire_protocol.cpp"
        if ($LASTEXITCODE -ne 0) { throw "driver test compile failed (cl exit $LASTEXITCODE)" }
        .\driver_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "driver tests failed" }
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:eye_format_tests.exe /Fo:eye_format_tests_ driver_cardboardplusplus\tests\test_eye_format.cpp"
        if ($LASTEXITCODE -ne 0) { throw "eye format test compile failed (cl exit $LASTEXITCODE)" }
        .\eye_format_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "eye format tests failed" }
