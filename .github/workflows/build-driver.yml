name: Build Driver

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # DriverVersion.h is baked from rev-list --count

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bake commit count into DriverVersion.h
      run: ./scripts/bake-driver-version.ps1
      shell: pwsh

    - name: Compile SPIR-V shaders (dxc)
      # Generates include/shaders/spirv/*.spv.h with the same dxc flags as the
      # Linux build; VulkanCompose embeds these instead of runtime-translating
      # DXBC through dxil-spirv (which emitted descriptor sets the pipeline
      # layouts never matched, and crashed on the NV12 compute shader).
      shell: pwsh
      run: |
        $summary = $env:GITHUB_STEP_SUMMARY
        # Syntax-check the script first: a parse error would otherwise fail the
        # step before any diagnostic output exists.
        $parseErrors = $null
        [System.Management.Automation.Language.Parser]::ParseFile(
          (Join-Path $PWD "scripts\build-spirv.ps1"), [ref]$null, [ref]$parseErrors) | Out-Null
        if ($parseErrors) {
          $msgs = $parseErrors | ForEach-Object { "PARSE line $($_.Extent.StartLineNumber): $($_.Message)" }
          $msgs | Add-Content $summary
          $msgs | Select-Object -First 8 | ForEach-Object { "::error::$_" }
          exit 1
        }
        $ErrorActionPreference = "Continue"
        $log = New-Object System.Collections.Generic.List[string]
        $stepExit = 0
        try {
          & ./scripts/build-spirv.ps1 2>&1 | ForEach-Object { $log.Add($_.ToString()) }
          if ($LASTEXITCODE -ne 0) { $stepExit = $LASTEXITCODE }
        } catch {
          $log.Add("THROWN: $($_.Exception.GetType().FullName): $($_.Exception.Message)")
          $log.Add($_.ScriptStackTrace)
          $stepExit = 1
        }
        $log | ForEach-Object { Write-Host $_ }
        $log | Add-Content $summary
        if ($stepExit -ne 0) {
          @($log | Select-Object -First 8) | ForEach-Object { "::error::$_" }
          exit 1
        }

    - name: Build Driver
      run: msbuild driver_cardboardplusplus\driver_cardboardplusplus.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:PlatformToolset=v143


    - name: Driver unit tests
      shell: pwsh
      run: |
        # cl is not on PATH in a bare pwsh shell; enter the VS dev environment first,
        # same as scripts/compile-driver.ps1 does locally.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsRoot = & $vswhere -latest -property installationPath
        $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:driver_tests.exe /Fo:driver_tests_ driver_cardboardplusplus\tests\test_wire_protocol.cpp"
        if ($LASTEXITCODE -ne 0) { throw "driver test compile failed (cl exit $LASTEXITCODE)" }
        .\driver_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "driver tests failed" }
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:eye_format_tests.exe /Fo:eye_format_tests_ driver_cardboardplusplus\tests\test_eye_format.cpp"
        if ($LASTEXITCODE -ne 0) { throw "eye format test compile failed (cl exit $LASTEXITCODE)" }
        .\eye_format_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "eye format tests failed" }
