name: Build Driver

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # TEMP: commit probe output for diagnostics (log storage unreachable)
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # DriverVersion.h is baked from rev-list --count

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bake commit count into DriverVersion.h
      run: ./scripts/bake-driver-version.ps1
      shell: pwsh

    - name: Shader binding probe (TEMP diagnostics)
      continue-on-error: true
      shell: pwsh
      run: |
        $log = "probe-run.txt"
        "probe step start" | Set-Content $log
        try {
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -property installationPath
          $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
          "vsRoot=$vsRoot" | Add-Content $log
          cmd /c "`"$devCmd`" -arch=x64 >nul && if not exist probeobj mkdir probeobj && cl /nologo /EHsc /MD /std:c++17 /wd4146 /wd4297 /wd4245 /wd4389 /wd4324 /I driver_cardboardplusplus\include /I driver_cardboardplusplus\include\dxil-spirv\dxbc-spirv /Fe:shader_probe.exe /Foprobeobj\ driver_cardboardplusplus\tests\shader_binding_probe.cpp driver_cardboardplusplus\src\SpirvCompiler.cpp /link /LIBPATH:driver_cardboardplusplus\lib\dxil-spirv dxbc-spirv.lib dxil-spirv-sbv.lib" *>> $log
          "cl exit=$LASTEXITCODE" | Add-Content $log
          if (Test-Path .\shader_probe.exe) {
            .\shader_probe.exe *>> $log
            "probe exit=$LASTEXITCODE" | Add-Content $log
          } else {
            "shader_probe.exe was not produced" | Add-Content $log
          }
        } catch {
          $_.ToString() | Add-Content $log
        }
        # Parse the emitted SPIR-V files in PowerShell (crash-proof) and report
        # the descriptor bindings the vendored translator assigned. Annotation
        # budget is tight, so only BINDING lines are emitted as ::error::.
        try {
          foreach ($name in @("compose_ps", "nv12_cs", "compose_vs")) {
            $path = Join-Path (Get-Location) "$name.spv"
            if (-not (Test-Path $path)) { Write-Host "MISSING $path"; continue }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $n = [math]::Floor($bytes.Length / 4)
            Write-Host "PARSE $name words=$n"
            $names = @{}
            $bindings = @{}
            $sets = @{}
            $i = 5
            while ($i + 1 -lt $n) {
              $w = [BitConverter]::ToUInt32($bytes, $i*4)
              $wc = $w -shr 16; $op = $w -band 0xFFFF
              if ($wc -eq 0) { break }
              if ($i + $wc -gt $n) { break }
              if ($op -eq 71 -and $wc -ge 3) {
                $t = [BitConverter]::ToUInt32($bytes, ($i+1)*4)
                $d = [BitConverter]::ToUInt32($bytes, ($i+2)*4)
                $lit = 0
                if ($wc -ge 4) { $lit = [BitConverter]::ToUInt32($bytes, ($i+3)*4) }
                if ($d -eq 34) { $bindings[$t] = $lit }
                if ($d -eq 35) { $sets[$t] = $lit }
              } elseif ($op -eq 5 -and $wc -ge 2) {
                $t = [BitConverter]::ToUInt32($bytes, ($i+1)*4)
                $sb = New-Object System.Text.StringBuilder
                for ($j = $i + 2; $j -lt ($i + $wc); $j++) {
                  $w4 = [BitConverter]::ToUInt32($bytes, $j*4)
                  foreach ($b in 0..3) {
                    $c = ($w4 -shr (8*$b)) -band 0xFF
                    if ($c -eq 0) { $j = $i + $wc; break }
                    [void]$sb.Append([char]$c)
                  }
                }
                $names[$t] = $sb.ToString()
              }
              $i += $wc
            }
            foreach ($id in $bindings.Keys) {
              $bnd = $bindings[$id]
              $st = if ($sets.ContainsKey($id)) { $sets[$id] } else { 0 }
              $nm = if ($names.ContainsKey($id)) { $names[$id] } else { "?" }
              $line = "BINDING $name set=$st binding=$bnd id=$id name='$nm'"
              Write-Host $line
              "::error::$line"
            }
            if ($bindings.Count -eq 0) { Write-Host "NO-BINDINGS $name"; "::error::NO-BINDINGS $name" }
          }
        } catch {
          $msg = "PARSE-EXCEPTION: $($_.ToString())"
          Write-Host $msg
          "::error::$msg"
        }
        $interesting = Get-Content $log | Select-String -Pattern '^(== |PROBE|probe exit|no shader_probe|cl exit)' | Select-Object -First 10
        $interesting
        $interesting | ForEach-Object { "::error::$($_.Line)" }

    - name: Build Driver
      run: msbuild driver_cardboardplusplus\driver_cardboardplusplus.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:PlatformToolset=v143


    - name: Driver unit tests
      shell: pwsh
      run: |
        # cl is not on PATH in a bare pwsh shell; enter the VS dev environment first,
        # same as scripts/compile-driver.ps1 does locally.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsRoot = & $vswhere -latest -property installationPath
        $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:driver_tests.exe /Fo:driver_tests_ driver_cardboardplusplus\tests\test_wire_protocol.cpp"
        if ($LASTEXITCODE -ne 0) { throw "driver test compile failed (cl exit $LASTEXITCODE)" }
        .\driver_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "driver tests failed" }
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:eye_format_tests.exe /Fo:eye_format_tests_ driver_cardboardplusplus\tests\test_eye_format.cpp"
        if ($LASTEXITCODE -ne 0) { throw "eye format test compile failed (cl exit $LASTEXITCODE)" }
        .\eye_format_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "eye format tests failed" }
