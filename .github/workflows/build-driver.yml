name: Build Driver

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # DriverVersion.h is baked from rev-list --count

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bake commit count into DriverVersion.h
      run: ./scripts/bake-driver-version.ps1
      shell: pwsh

    - name: Build Driver
      run: msbuild driver_cardboardplusplus\driver_cardboardplusplus.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:PlatformToolset=v143

    - name: Driver unit tests
      shell: pwsh
      run: |
        # cl is not on PATH in a bare pwsh shell; enter the VS dev environment first,
        # same as scripts/compile-driver.ps1 does locally.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsRoot = & $vswhere -latest -property installationPath
        $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
        cmd /c "`"$devCmd`" -arch=x64 >nul && cl /nologo /EHsc /std:c++14 /I driver_cardboardplusplus\include /Fe:driver_tests.exe /Fo:driver_tests_ driver_cardboardplusplus\tests\test_wire_protocol.cpp"
        if ($LASTEXITCODE -ne 0) { throw "driver test compile failed (cl exit $LASTEXITCODE)" }
        .\driver_tests.exe
        if ($LASTEXITCODE -ne 0) { throw "driver tests failed" }
